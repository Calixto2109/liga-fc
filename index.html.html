<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LigaJá — Entre em campo</title><meta name="description" content="Encontre jogadores amadores, organize seu time e conecte sua empresa a outras equipes."><style>
:root{--navy:#101c38;--blue:#3155e7;--lime:#cefa6a;--muted:#657087;--line:#e3e7ee;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:16px/1.5 Inter,system-ui,-apple-system,Arial,sans-serif}button,input,select{font:inherit}button,a,input,select{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button{border:0}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #668aff;outline-offset:3px}button:disabled{cursor:default;opacity:.65}a{color:inherit}header{height:88px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 4%;gap:48px}.brand{font-size:29px;font-weight:900;letter-spacing:-1.5px;text-decoration:none;white-space:nowrap}.brand span{color:var(--blue)}.brand small{display:inline-grid;place-items:center;background:var(--lime);border-radius:10px;width:34px;height:34px;font-size:23px;letter-spacing:0;margin-right:9px}nav{display:flex;gap:7px;flex:1}nav button{background:none;padding:12px 15px;color:var(--muted);font-weight:650;font-size:14px;border-radius:9px}nav button.active{background:#edf1ff;color:var(--blue)}.btn{display:inline-flex;justify-content:center;align-items:center;gap:9px;border-radius:9px;padding:12px 18px;font-weight:700;font-size:14px;background:var(--blue);color:white;text-decoration:none;min-height:44px}.btn:hover{filter:brightness(.94)}.btn.light{background:white;border:1px solid var(--line);color:var(--navy)}.btn.lime{background:var(--lime);color:var(--navy)}main{max-width:1370px;margin:auto;padding:35px 4% 55px}.eyebrow{text-transform:uppercase;letter-spacing:1.8px;font-size:12px;font-weight:800;color:var(--blue)}h1{font-size:34px;line-height:1.2;letter-spacing:-1.2px;margin:8px 0 10px}h2{font-size:21px;letter-spacing:-.5px;margin:0}h3{font-size:18px;margin:0 0 6px}p{margin:0;color:var(--muted)}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:27px}.pill{display:inline-block;border-radius:6px;padding:5px 9px;background:#eef2ff;color:#3450bc;font-size:12px;font-weight:750}.notice{font-size:13px;color:var(--muted);margin-top:26px;border-top:1px solid var(--line);padding-top:17px}.banner{background:var(--navy);border-radius:16px;padding:29px 32px;display:flex;align-items:center;justify-content:space-between;gap:25px;color:white;margin-bottom:29px;border-right:8px solid var(--lime)}.banner h2{font-size:27px;margin:5px 0 8px}.banner p{color:#bac6dd;max-width:570px}.banner .eyebrow{color:var(--lime)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:25px}.filters{background:white;border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;gap:12px;margin:18px 0}.filters input{flex:1;min-width:90px}.filters input,.filters select{background:var(--bg);border:1px solid var(--line);padding:11px 12px;border-radius:8px;color:var(--navy);font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:22px;transition:box-shadow .2s,transform .2s}.card:hover{box-shadow:0 7px 24px #142b4e0a;transform:translateY(-2px)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.card .row{margin-bottom:16px}.badge{width:47px;height:47px;display:grid;place-items:center;border-radius:13px;background:#e9eeff;color:#3454cf;font-size:16px;font-weight:900;flex-shrink:0}.badge.green{background:#e8f4dc;color:#426b20}.badge.orange{background:#fff0dd;color:#976315}.badge.purple{background:#efebff;color:#6952b5}.meta{font-size:14px;color:var(--muted)}.details{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:21px 0}.details small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}.details strong{font-weight:650;font-size:14px}.card footer{border-top:1px solid var(--line);padding-top:15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.spots{color:#428036;font-size:13px;font-weight:700}.side{display:flex;flex-direction:column;gap:20px}.side .card{padding:22px}.rankrow{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.rankrow:last-of-type{border:0}.rankrow .badge{width:36px;height:36px;font-size:12px;border-radius:9px}.rankrow strong{font-size:14px;display:block}.rankrow small{font-size:12px;color:var(--muted)}.rankrow>b{margin-left:auto;font-size:14px}.ranknum{color:var(--muted);font-size:13px;min-width:12px}.textbutton{background:none;color:var(--blue);font-weight:750;font-size:14px;padding:12px 0 0}.side p{font-size:14px}.side .btn{width:100%;margin-top:18px}.steps{padding:0;list-style:none;margin:18px 0 0;counter-reset:step}.steps li{counter-increment:step;display:flex;gap:11px;font-size:14px;margin:15px 0;color:var(--muted)}.steps li:before{content:counter(step);height:23px;min-width:23px;border-radius:50%;background:#eef1f7;text-align:center;color:var(--navy);font-weight:700}.fullgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.empty{text-align:center;background:white;border:1px dashed #c8d0df;border-radius:12px;padding:45px 20px;grid-column:1/-1}.empty h3{margin-bottom:8px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:white}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th{background:#eef1f7;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}td,th{padding:18px 20px;border-bottom:1px solid var(--line)}td{font-size:14px}td:nth-child(3){color:var(--blue);font-weight:800}td .badge{display:inline-grid;vertical-align:middle;margin-right:12px;width:36px;height:36px;font-size:12px}.rules{margin-top:18px;font-size:14px}.rules summary{cursor:pointer;font-weight:700}.rules p{margin-top:10px}.viewtitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.viewtitle small{color:var(--muted)}dialog{border:0;border-radius:17px;padding:29px;width:min(520px,calc(100% - 28px));max-height:90vh;overflow:auto;color:var(--navy);box-shadow:0 25px 90px #0004}dialog::backdrop{background:#0c1739a6;backdrop-filter:blur(3px)}dialog h2{margin-bottom:8px}.close{background:#eff2f7;border-radius:50%;width:34px;height:34px;font-size:21px;color:var(--navy);float:right}form{display:grid;gap:15px;margin-top:23px}label{font-size:14px;font-weight:650;display:grid;gap:6px}label input,label select{width:100%;padding:12px;border:1px solid #cfd6e1;border-radius:8px;background:white;color:var(--navy)}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formnote{font-size:13px;padding:12px;background:#f0f3fb;border-radius:8px}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:14px 22px;border-radius:10px;box-shadow:0 7px 30px #0002;z-index:5;max-width:90%;font-size:14px}#toast:empty{display:none}.help{margin-top:22px;padding:17px 21px;border-left:3px solid var(--blue);background:#ecf0ff;border-radius:0 9px 9px 0;font-size:14px}.skip{position:absolute;top:-100px}.skip:focus{top:0;background:white;padding:10px;z-index:10}@media(min-width:1500px){header{padding:0 calc((100% - 1260px)/2)}}@media(max-width:1050px){header{gap:18px;padding:0 3%}nav button{padding:11px 10px}.layout{grid-template-columns:minmax(0,1fr) 260px}.card{padding:17px}.fullgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:800px){header{height:auto;flex-wrap:wrap;padding:17px 5% 0;justify-content:space-between;gap:12px}.brand{font-size:26px}header>.btn{margin-left:auto}nav{order:3;flex-basis:100%;overflow:auto;gap:0}nav button{flex:1;white-space:nowrap;padding:14px 11px;border-radius:0;border-bottom:3px solid transparent}nav button.active{background:none;border-color:var(--blue)}main{padding:25px 5%}.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.banner{padding:23px;align-items:flex-start;flex-direction:column}.banner h2{font-size:24px}h1{font-size:29px}.heading{align-items:flex-start}.heading>.pill{display:none}.filters{flex-wrap:wrap}.filters input{flex-basis:100%}.filters select{flex:1}.tablewrap{max-width:100%}}@media(max-width:520px){.grid,.fullgrid,.side{grid-template-columns:1fr}.heading p{font-size:14px}header>.btn{padding:10px 12px;font-size:13px}.brand small{width:29px;height:29px}.brand{font-size:25px}nav button{font-size:13px;padding:13px 8px}.banner h2{font-size:23px}.banner p{font-size:14px}.banner .btn{width:100%}.formrow{grid-template-columns:1fr}h1{font-size:28px}.viewtitle{gap:12px}.viewtitle h2{font-size:19px}.card{padding:21px}.details{gap:14px}.notice{font-size:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><a class="skip" href="#main">Pular para o conteúdo</a><header><a href="#partidas" class="brand" aria-label="LigaJá início"><small aria-hidden="true">↗</small>Liga<span>Já</span></a><nav aria-label="Navegação principal"><button data-view="partidas">Encontrar partidas</button><button data-view="jogadores">Jogadores</button><button data-view="empresas">Times de empresas</button><button data-view="ranking">Ranking</button></nav><button class="btn" id="register">+ Cadastrar time</button></header><main id="main" tabindex="-1"></main><dialog id="modal" aria-labelledby="modal-title"><button class="close" aria-label="Fechar">×</button><div id="modalbody"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seedTeams=[{id:'t1',name:'Vértice FC',company:'Vértice Tecnologia',city:'Curitiba',mode:'Society',j:8,v:6,e:1,d:1,gp:24,gc:10,color:'',demo:true},{id:'t2',name:'Atlas United',company:'Atlas Logística',city:'Curitiba',mode:'Society',j:8,v:5,e:2,d:1,gp:21,gc:11,color:'green',demo:true},{id:'t3',name:'Órbita Esporte',company:'Órbita Digital',city:'Curitiba',mode:'Futsal',j:7,v:5,e:0,d:2,gp:23,gc:15,color:'purple',demo:true},{id:'t4',name:'Norte FC',company:'Norte Engenharia',city:'São José dos Pinhais',mode:'Society',j:8,v:4,e:1,d:3,gp:16,gc:12,color:'orange',demo:true}];
const players=[{id:'p1',name:'Lucas Almeida',position:'Goleiro',city:'Curitiba',mode:'Society',time:'Noites e fins de semana',color:'green'},{id:'p2',name:'Rafael Santos',position:'Meio-campo',city:'Curitiba',mode:'Society',time:'Terças e quintas à noite',color:''},{id:'p3',name:'Bruno Costa',position:'Atacante',city:'Curitiba',mode:'Futsal',time:'Fins de semana',color:'orange'},{id:'p4',name:'Diego Oliveira',position:'Defensor',city:'São José dos Pinhais',mode:'Campo',time:'Sábados de manhã',color:'purple'}];
const matches=[{id:'m1',name:'Society da galera',host:'Vértice FC',city:'Curitiba',place:'Água Verde',mode:'Society',day:'Terça-feira',hour:'20h – 21h',spots:3,price:'R$ 25 / pessoa',level:'Recreativo',color:''},{id:'m2',name:'Futsal depois do trabalho',host:'Órbita Esporte',city:'Curitiba',place:'Portão',mode:'Futsal',day:'Quinta-feira',hour:'19h – 20h',spots:2,price:'R$ 20 / pessoa',level:'Intermediário',color:'purple'},{id:'m3',name:'Sábado em campo',host:'Norte FC',city:'São José dos Pinhais',place:'Centro',mode:'Campo',day:'Sábado',hour:'09h – 10h30',spots:4,price:'R$ 15 / pessoa',level:'Recreativo',color:'orange'},{id:'m4',name:'Resenha de domingo',host:'Atlas United',city:'Curitiba',place:'Santa Felicidade',mode:'Society',day:'Domingo',hour:'10h – 11h',spots:1,price:'R$ 30 / pessoa',level:'Recreativo',color:'green'}];
let own=[];try{const saved=JSON.parse(localStorage.getItem('ligaja-teams-v1')||'[]');if(Array.isArray(saved))own=saved.filter(t=>t&&typeof t.id==='string'&&typeof t.name==='string'&&typeof t.company==='string'&&typeof t.city==='string'&&['Society','Futsal','Campo'].includes(t.mode)).map(t=>({...t,j:0,v:0,e:0,d:0,gp:0,gc:0,demo:false}));}catch{}
let view='partidas',query='',mode='',city='';let toastTimer;const initials=n=>n.split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase();const teams=()=>[...seedTeams,...own];const badge=(n,c='')=>`<span class="badge ${esc(c)}" aria-hidden="true">${esc(initials(n))}</span>`;const points=t=>t.v*3+t.e;const sorted=()=>teams().sort((a,b)=>points(b)-points(a)||(b.gp-b.gc)-(a.gp-a.gc)||b.gp-a.gp||a.name.localeCompare(b.name));
function toast(t){$('#toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',5000)}
const titles={partidas:['Seu próximo jogo começa aqui.','Encontre uma partida, escolha seu horário e entre em campo.'],jogadores:['Falta alguém para fechar o time?','Encontre jogadores amadores por cidade e modalidade.'],empresas:['A próxima rivalidade é entre empresas.','Cadastre sua equipe e encontre outros times para um amistoso.'],ranking:['Cada jogo conta.','Acompanhe a classificação dos times de empresas.']};
function navigate(v){view=titles[v]?v:'partidas';query=mode=city='';document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});render()}
function filters(){return `<div class="filters"><input id="search" type="search" aria-label="Buscar por nome ou bairro" placeholder="${view==='jogadores'?'Buscar jogador ou posição…':view==='empresas'?'Buscar time ou empresa…':'Buscar partida ou bairro…'}"><select id="city" aria-label="Filtrar por cidade"><option value="">Todas as cidades</option>${[...new Set([...teams(),...players,...matches].map(x=>x.city))].sort().map(c=>`<option>${esc(c)}</option>`).join('')}</select><select id="mode" aria-label="Filtrar por modalidade"><option value="">Todas as modalidades</option><option>Society</option><option>Futsal</option><option>Campo</option></select></div>`}
function render(){const t=titles[view];$('#main').innerHTML=`<div class="heading"><div><div class="eyebrow">Futebol amador conectado</div><h1>${t[0]}</h1><p>${t[1]}</p></div><span class="pill">Versão demonstrativa</span></div>${view==='partidas'?`<div class="banner"><div><span class="eyebrow">Liga de empresas</span><h2>Do escritório para o campo.</h2><p>Reúna seus colegas, encontre adversários e acompanhe seu time no ranking.</p></div><button class="btn lime" data-go="empresas">Encontrar times de empresas ↗</button></div><div class="layout"><section><div class="viewtitle"><h2>Partidas com vagas</h2><small id="count"></small></div>${filters()}<div id="results" class="grid"></div></section><aside class="side"><div class="card"><span class="eyebrow">Liga de empresas</span><h2 style="margin-top:6px">No topo da tabela</h2><p style="margin-top:5px">Classificação de exemplo</p>${sorted().slice(0,3).map((t,i)=>`<div class="rankrow"><span class="ranknum">${i+1}</span>${badge(t.name,t.color)}<div><strong>${esc(t.name)}</strong><small>${t.j} jogos</small></div><b>${points(t)} pts</b></div>`).join('')}<button class="textbutton" data-go="ranking">Ver ranking completo →</button></div><div class="card"><h3>Seu lugar no jogo</h3><ol class="steps"><li>Encontre uma partida na sua região.</li><li>Confira horário, valor e vagas.</li><li>Solicite sua participação ao organizador.</li></ol><p>As solicitações são simuladas nesta versão.</p></div></aside></div>`:view==='ranking'?`${filters()}<div id="results"></div><details class="rules"><summary>Como funciona a classificação?</summary><p>Vitória: 3 pontos · Empate: 1 ponto · Derrota: 0 pontos. Desempate por saldo de gols, depois gols marcados. Times sem partidas ficam com zero pontos. Os resultados desta demonstração são fictícios.</p></details>`:`<div class="viewtitle"><h2>${view==='jogadores'?'Jogadores disponíveis':'Encontre seu próximo adversário'}</h2><small id="count"></small></div>${filters()}<div id="results" class="grid fullgrid"></div>${view==='empresas'?'<div class="help"><strong>Sua empresa também joga?</strong> Cadastre o time no botão acima para experimentar o cadastro e vê-lo na classificação.</div>':''}`}<p class="notice">Demonstração interativa · Partidas, jogadores e resultados de exemplo. Cadastros novos ficam apenas neste navegador. Convites e desafios não são enviados a outras pessoas.</p>`;$('#search').addEventListener('input',e=>{query=e.target.value;results()});$('#city').addEventListener('change',e=>{city=e.target.value;results()});$('#mode').addEventListener('change',e=>{mode=e.target.value;results()});results()}
function results(){let data=view==='partidas'?matches:view==='jogadores'?players:view==='ranking'?sorted():teams();const normalize=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();data=data.filter(x=>(!city||x.city===city)&&(!mode||x.mode===mode)&&normalize([x.name,x.company,x.place,x.position,x.city].join(' ')).includes(normalize(query)));if($('#count'))$('#count').textContent=`${data.length} ${data.length===1?'resultado':'resultados'}`;if(!data.length){$('#results').innerHTML='<div class="empty"><h3>Nenhum resultado por aqui.</h3><p>Tente outra cidade, modalidade ou termo de busca.</p><button class="textbutton" id="reset">Limpar filtros</button></div>';$('#reset').onclick=()=>{query=mode=city='';$('#search').value=$('#city').value=$('#mode').value='';results()};return}$('#results').innerHTML=view==='ranking'?`<div class="tablewrap"><table><caption style="text-align:left;padding:18px 20px;font-weight:700">Classificação · ${data.length} times</caption><thead><tr><th scope="col">Pos.</th><th scope="col">Time / empresa</th><th scope="col">Pts</th><th scope="col">J</th><th scope="col">V</th><th scope="col">E</th><th scope="col">D</th><th scope="col">SG</th></tr></thead><tbody>${data.map((t,i)=>`<tr><td>${i+1}</td><td>${badge(t.name,t.color)}<strong>${esc(t.name)}</strong><div class="meta" style="padding-left:48px">${esc(t.company)}${t.demo?'':' · Cadastro local'}</div></td><td>${points(t)}</td><td>${t.j}</td><td>${t.v}</td><td>${t.e}</td><td>${t.d}</td><td>${t.gp-t.gc>0?'+':''}${t.gp-t.gc}</td></tr>`).join('')}</tbody></table></div><p class="meta" style="margin-top:12px">Pts: pontos · J: jogos · V: vitórias · E: empates · D: derrotas · SG: saldo de gols</p>`:data.map(x=>view==='partidas'?`<article class="card"><div class="row"><span class="pill">${x.mode}</span><span class="spots">${x.spots} ${x.spots===1?'vaga disponível':'vagas disponíveis'}</span></div><h3>${x.name}</h3><p class="meta">${x.place} · ${x.city}</p><div class="details"><div><small>Quando</small><strong>${x.day}</strong></div><div><small>Horário</small><strong>${x.hour}</strong></div><div><small>Nível</small><strong>${x.level}</strong></div><div><small>Contribuição</small><strong>${x.price}</strong></div></div><footer><span class="meta">${x.host}</span><button class="btn light" data-detail="${x.id}">Ver partida →</button></footer></article>`:view==='jogadores'?`<article class="card"><div class="row">${badge(x.name,x.color)}<span class="pill">${x.mode}</span></div><h3>${x.name}</h3><p class="meta">${x.position} · ${x.city}</p><div class="details"><div style="grid-column:1/-1"><small>Disponibilidade</small><strong>${x.time}</strong></div></div><footer><span class="spots">Busca um time</span><button class="btn light" data-invite="${x.id}">Convidar</button></footer></article>`:`<article class="card"><div class="row">${badge(x.name,x.color)}<span class="pill">${esc(x.mode)}</span></div><h3>${esc(x.name)}</h3><p class="meta">${esc(x.company)}</p><div class="details"><div><small>Cidade</small><strong>${esc(x.city)}</strong></div><div><small>Na liga</small><strong>${x.j} jogos · ${points(x)} pontos</strong></div></div><footer><span class="meta">${x.demo?'Time de exemplo':'Cadastro local'}</span><button class="btn light" data-challenge="${esc(x.id)}">Desafiar →</button></footer></article>`).join('')}
function openModal(html){$('#modalbody').innerHTML=html;$('#modal').showModal()}$('.close').onclick=()=>$('#modal').close();$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#modal').close()}});
$('#register').onclick=()=>{openModal(`<h2 id="modal-title">Cadastre seu time</h2><p>Leve o futebol da sua empresa para a liga.</p><form id="teamform"><label>Nome do time<input name="name" required maxlength="55" placeholder="Ex.: Pinho FC"></label><label>Empresa<input name="company" required maxlength="70" placeholder="Nome da empresa"></label><div class="formrow"><label>Cidade<input name="city" required maxlength="60" placeholder="Ex.: Curitiba"></label><label>Modalidade<select name="mode"><option>Society</option><option>Futsal</option><option>Campo</option></select></label></div><p class="formnote">Este cadastro fica salvo somente neste navegador. Ainda não será publicado para outros jogadores.</p><p id="formerror" role="alert"></p><button class="btn" type="submit">Cadastrar time</button></form>`);$('#teamform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const t={id:'local-'+Date.now(),name:f.get('name').trim(),company:f.get('company').trim(),city:f.get('city').trim(),mode:f.get('mode'),j:0,v:0,e:0,d:0,gp:0,gc:0,demo:false,color:'green'};if(!t.name||!t.company||!t.city){$('#formerror').textContent='Preencha todos os campos com texto válido.';return}try{localStorage.setItem('ligaja-teams-v1',JSON.stringify([...own,t]));own.push(t)}catch{$('#formerror').textContent='Não foi possível salvar. Verifique se o navegador permite armazenamento local.';return}$('#modal').close();location.hash='empresas';navigate('empresas');toast('Time cadastrado neste navegador. Ele também aparece no ranking.')}};
function invitation(kind,id){const target=kind==='invite'?players.find(p=>p.id===id):teams().find(t=>t.id===id);if(!target)return;openModal(`<h2 id="modal-title">${kind==='invite'?'Convidar jogador':'Desafiar time'}</h2><p>${esc(target.name)}</p>${own.length?`<form id="inviteform"><label>Seu time<select name="team">${own.filter(t=>t.id!==id).map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}</select></label><label>Data sugerida<input type="date" name="date" min="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}" required></label><p class="formnote">Simulação: nenhum convite será enviado. A conexão com outros usuários ainda precisa ser integrada.</p><button class="btn" type="submit">Simular ${kind==='invite'?'convite':'desafio'}</button></form>`:`<div class="help">Cadastre seu time primeiro para experimentar ${kind==='invite'?'o convite':'o desafio'}.</div><button class="btn" id="frominvite" style="margin-top:20px">Cadastrar meu time</button>`}`);if($('#frominvite'))$('#frominvite').onclick=()=>{$('#modal').close();$('#register').click()};if($('#inviteform'))$('#inviteform').onsubmit=e=>{e.preventDefault();if(!e.target.elements.team.value){toast('Escolha outro time para fazer o desafio.');return}$('#modal').close();toast('Simulação concluída. Nenhum convite foi enviado.')}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view||b.dataset.go){const v=b.dataset.view||b.dataset.go;location.hash=v;navigate(v)}if(b.dataset.detail){const m=matches.find(x=>x.id===b.dataset.detail);openModal(`<span class="pill">${m.mode} · Exemplo</span><h2 id="modal-title" style="margin-top:15px">${m.name}</h2><p>Organização: ${m.host}</p><div class="details"><div><small>Local</small><strong>${m.place}, ${m.city}</strong></div><div><small>Quando</small><strong>${m.day} · ${m.hour}</strong></div><div><small>Valor por pessoa</small><strong>${m.price}</strong></div><div><small>Vagas</small><strong>${m.spots} disponíveis</strong></div></div><p class="formnote">Esta é uma partida fictícia. Você pode experimentar a solicitação, mas nenhuma reserva será feita.</p><button class="btn" id="join" style="margin-top:20px;width:100%">Simular pedido de participação</button>`);$('#join').onclick=()=>{$('#modal').close();toast('Solicitação simulada. Nenhuma vaga foi reservada.')}}if(b.dataset.invite)invitation('invite',b.dataset.invite);if(b.dataset.challenge)invitation('challenge',b.dataset.challenge)});
window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));navigate(location.hash.slice(1));
</script></body></html>
